openapi: 3.1.0
info:
  title: NativeLens API
  version: 1.0.0
  description: Storefront API for AI-assisted translation and language coaching.
servers:
  - url: /api/v1
security:
  - passport: []
paths:
  /contact-requests:
    post:
      security: [{ passport: [] }, {}]
      summary: Submit a Contact request (guest or optional authenticated identity)
      description: Authenticated requests may include a Passport bearer token or Laravel session. Guest identity fields are required. Telegram delivery is asynchronous after persistence.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '202': { description: Contact request persisted and queued for Telegram delivery }
        '422': { description: Validation failed }
        '429': { description: Rate limit exceeded }

  /me:
    get:
      summary: Current user
      responses:
        '200':
          description: Authenticated user
  /translation-requests:
    post:
      summary: Create translation request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTranslationRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationRequest'
        '401':
          description: Sign-in required (anonymous or inactive account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessError'
        '403':
          description: Account is blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessError'
  /translation-requests/{translationRequest}:
    parameters:
      - name: translationRequest
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get translation status/result
      responses:
        '200':
          description: Translation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationRequest'
        '401':
          description: Sign-in required (anonymous or inactive account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessError'
        '403':
          description: Account is blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessError'
    delete:
      summary: Cancel translation request
      responses:
        '204':
          description: Cancelled or already terminal
        '401':
          description: Sign-in required (anonymous or inactive account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessError'
        '403':
          description: Account is blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessError'
  /auth/login:
    post:
      security: []
      summary: Exchange local credentials for a Passport access token
      responses:
        '200': { description: Passport access token }
  /auth/social/exchange:
    post:
      security: []
      summary: Exchange a one-time social login ticket for a Passport access token
      responses:
        '200': { description: Passport access token }
  /auth/register:
    post:
      security: []
      summary: Register local user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 6, maxLength: 32, format: password, description: Special characters are allowed }
                password_confirmation: { type: string, minLength: 6, maxLength: 32, format: password }
                avatar: { type: string, format: binary, description: Optional JPG or PNG image up to 2 MB }
      responses:
        '201': { description: Created }
        '422': { description: Invalid registration fields or avatar }
  /auth/forgot-password:
    post:
      security: []
      summary: Send password reset link
      responses:
        '202': { description: Accepted }
  /auth/reset-password:
    post:
      security: []
      summary: Reset a user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6, maxLength: 32, format: password }
                password_confirmation: { type: string, minLength: 6, maxLength: 32, format: password }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
components:
  securitySchemes:
    passport:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            profile: Read own profile
            translate: Create and manage own translations
  schemas:
    CreateContactRequest:
      type: object
      required: [message]
      properties:
        first_name: { type: string, maxLength: 120, description: Required for guests; ignored identity is not accepted for authenticated users. }
        last_name: { type: string, maxLength: 120, description: Required for guests. }
        email: { type: string, format: email, maxLength: 255, description: Required for guests. }
        message: { type: string, minLength: 1, maxLength: 10000 }
        images[]:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
            description: JPEG or PNG up to 5 MB each.
    AccessError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [login_required, account_blocked]
        message: { type: string }
    CreateTranslationRequest:
      type: object
      required: [source_text, source_language, target_language]
      properties:
        source_text:
          type: string
          minLength: 1
          maxLength: 12000
        source_language:
          type: string
          examples: [en]
        target_language:
          type: string
          examples: [uk]
    TranslationRequest:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, processing, completed, failed, cancelled]
        translation: { type: [string, 'null'] }
        natural_usage:
          oneOf:
            - type: object
              additionalProperties: false
              required: [expression, example]
              properties:
                expression: { type: string }
                example: { type: string }
            - type: 'null'
        source_corrected: { type: [string, 'null'] }
        issues:
          type: array
          items:
            $ref: '#/components/schemas/LanguageIssue'
    LanguageIssue:
      type: object
      properties:
        type: { type: string }
        original: { type: string }
        correction: { type: string }
        explanation: { type: string }
        severity: { type: string, enum: [info, warning, error] }
