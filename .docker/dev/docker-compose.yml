name: "language-study"

services:
  language-study-php-fpm:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/php/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: language-study-php-fpm:1.0
    container_name: language-study-php-fpm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../httpdocs/backend:/var/www/html
      - ../../storage:/var/www/storage
      - ../../xhprof:/var/www/xhprof
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ../../.docker/dev/php/supervisord.conf:/etc/supervisord.conf:ro
      - ../../.docker/dev/php/horizon.conf:/etc/supervisor/conf.d/horizon.conf:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      language-study-mariadb:
        condition: service_healthy
    networks:
      - language-study-net

  language-study-nginx:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: language-study-nginx:1.0-alpine-slim
    container_name: language-study-nginx
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.language-study-nginx.rule=Host(`dev.api.language-study.com`)"
      - "traefik.http.routers.language-study-nginx.entrypoints=web"
      - "traefik.http.services.language-study-nginx.loadbalancer.server.port=80"
    volumes:
      - ../../httpdocs/backend:/var/www/html:ro
      - ../../storage:/var/www/storage:ro
      - ../../.docker/dev/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../httpdocs/frontend/public/images/social:/var/www/qr-social:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - language-study-php-fpm
    networks:
      - traefik-network
      - language-study-net

  language-study-nodejs:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/nodejs/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: node
    image: language-study-nodejs:1.0-slim
    container_name: language-study-nodejs
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.language-study-nodejs.rule=Host(`dev.language-study.com`)"
      - "traefik.http.routers.language-study-nodejs.entrypoints=web"
      - "traefik.http.services.language-study-nodejs.loadbalancer.server.port=3000"
    ports:
      - "3001:3000"  # Nuxt
      - "9230:9229"  # Node inspector
    volumes:
      - ../../httpdocs/frontend:/var/www/html
      - ../../storage:/var/www/storage
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - traefik-network
      - language-study-net
  
  language-study-mariadb:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/mariadb/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: mysql
    image: language-study-mariadb:1.0
    container_name: language-study-mariadb
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping --protocol=tcp -h 127.0.0.1 -P 3306 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "3352:3306"
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../.db/mariadb:/var/lib/mysql
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - language-study-net

networks:
  traefik-network:
    name: traefik-network
    driver: bridge
    external: true
  language-study-net:
    name: language-study-net
    driver: bridge
    external: true