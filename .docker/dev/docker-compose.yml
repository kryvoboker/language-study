name: "language-study"

services:
  language-study-php-fpm:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/php/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: language-study-php-fpm:1.0
    container_name: language-study-php-fpm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../httpdocs/backend:/var/www/html
      - ../../storage:/var/www/storage
      - ../../xhprof:/var/www/xhprof
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ../../.docker/dev/php/supervisord.conf:/etc/supervisord.conf:ro
      - ../../.docker/dev/php/horizon.conf:/etc/supervisor/conf.d/horizon.conf:ro
    init: true # Ensures proper signal handling and zombie reaping
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      language-study-postgresql:
        condition: service_healthy
      language-study-redis:
        condition: service_healthy
    networks:
      - language-study-net

  language-study-nginx:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: language-study-nginx:1.0-alpine-slim
    container_name: language-study-nginx
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.language-study-nginx.rule=Host(`dev.api.language-study.com`)"
      - "traefik.http.routers.language-study-nginx.entrypoints=web"
      - "traefik.http.services.language-study-nginx.loadbalancer.server.port=80"
    volumes:
      - ../../httpdocs/backend:/var/www/html:ro
      - ../../storage:/var/www/storage:ro
      - ../../.docker/dev/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../httpdocs/frontend/public/images/social:/var/www/qr-social:ro
    init: true # Ensures proper signal handling and zombie reaping
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - language-study-php-fpm
    networks:
      - traefik-network
      - language-study-net

  language-study-nodejs:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/nodejs/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: node
    image: language-study-nodejs:1.0-slim
    container_name: language-study-nodejs
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.language-study-nodejs.rule=Host(`dev.language-study.com`)"
      - "traefik.http.routers.language-study-nodejs.entrypoints=web"
      - "traefik.http.services.language-study-nodejs.loadbalancer.server.port=3000"
    ports:
      - "3001:3000"  # Nuxt
      - "9230:9229"  # Node inspector
    volumes:
      - ../../httpdocs/frontend:/var/www/html
      - ../../storage:/var/www/storage
    init: true # Ensures proper signal handling and zombie reaping
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - traefik-network
      - language-study-net

  language-study-postgresql:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/postgresql/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: postgres
    image: language-study-postgresql:1.0-alpine
    container_name: language-study-postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=$${POSTGRES_SIMPLE_USER} --dbname=$${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 1
    ports:
      - "3352:5432"
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../.db/postgresql:/var/lib/postgresql
    init: true # Ensures proper signal handling and zombie reaping
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - language-study-net

  language-study-redis:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/redis/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: redis
    image: language-study-redis:1.0-alpine
    container_name: language-study-redis
    restart: unless-stopped
    ports:
      - "42610:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ../../.db/redis:/data
    init: true # Ensures proper signal handling and zombie reaping
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - language-study-net

networks:
  traefik-network:
    name: traefik-network
    driver: bridge
    external: true
  language-study-net:
    name: language-study-net
    driver: bridge
    external: true